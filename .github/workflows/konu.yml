name: Konu araması

# Sitedeki "Konu ara" sekmesi, kullanıcının GitHub anahtarıyla data/konu-istek.json dosyasını yazar;
# bu dosya değişince arama çalışır, sonuç site/konular/ altına yazılıp site yeniden yayınlanır.
# Arama mantığı radar/konu.py içinde ve GitHub'dan bağımsızdır (bkz. docs/halka-acma-notlari.md).
on:
  push:
    branches: [main]
    paths: [data/konu-istek.json]
  workflow_dispatch:
    inputs:
      konu:
        description: "Aranacak konu (virgülle en çok 3 ifade)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tara   # günlük taramayla aynı anda çalışmasın (aynı veri dosyalarını yazıyorlar)
  cancel-in-progress: false

jobs:
  konu:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Konu araması
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          KONU: ${{ inputs.konu }}
        run: |
          if [ -n "$KONU" ]; then python -m radar.konu "$KONU"; else python -m radar.konu --istek; fi

      - name: Sonucu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/konular
          if ! git diff --cached --quiet; then
            git commit -m "konu: arama sonucu $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase
            git push
          fi

      - name: Önbellek sürümü
        run: sed -i "s/__SURUM__/${GITHUB_SHA::8}/g" site/index.html site/style.css

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: yayin
        uses: actions/deploy-pages@v5
