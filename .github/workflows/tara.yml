name: Tarama

# Otomatik tarama şimdilik kapalı (site geliştirme aşaması). Yalnızca elle başlatılır.
# Düzene bağlanınca geri açılacak, örnek:
#   schedule:
#     - cron: "0 9 * * *"   # TSİ 12:00, kota TSİ 11:00'de yenilenir
on:
  workflow_dispatch:
    inputs:
      tarama:
        description: "YouTube taraması yapılsın mı? Hayır: kota harcamadan yalnızca siteyi yayınlar."
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest discover -s tests

      - name: Tarama
        if: ${{ inputs.tarama }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -m radar.main

      - name: Veriyi kaydet
        if: ${{ inputs.tarama }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/liste.json
          if ! git diff --cached --quiet; then
            git commit -m "veri: $(date -u +%Y-%m-%d)"
            git pull --rebase  # tarama sürerken siteden engel eklenmiş olabilir
            git push
          fi

      # Tarayıcılar eski app.js / style.css'i önbellekten kullanmasın: her yayına kendi sürüm etiketi.
      - name: Önbellek sürümü
        run: sed -i "s/__SURUM__/${GITHUB_SHA::8}/g" site/index.html site/style.css

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: yayin
        uses: actions/deploy-pages@v5
