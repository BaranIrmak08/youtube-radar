<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Radar</title>
<meta name="description" content="Kanalının normalinin çok üstünde izlenen YouTube videoları ve hızlı büyüyen yeni kanallar, her taramada güncellenen tek liste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="ust-bar">
  <div class="kap ust-bar__ic">
    <h1>YouTube Radar</h1>
    <div class="ust-bar__sag">
      <p id="durum" class="durum">Yükleniyor…</p>
      <a class="imza" href="https://github.com/BaranIrmak08" target="_blank" rel="noopener">Made by BaranIrmak08</a>
      <button type="button" id="ayarlar-ac" class="imza imza--btn">Ayarlar</button>
    </div>
  </div>
</header>

<div class="kap">
  <p id="ornek-uyari" class="uyari" hidden>Gerçek veri henüz yok, örnek veri gösteriliyor.</p>

  <nav class="arac" aria-label="Liste">
    <div class="sekmeler" role="tablist">
      <button type="button" role="tab" data-sekme="videolar" class="aktif">Patlayan videolar</button>
      <button type="button" role="tab" data-sekme="yeni">Yeni kanallar</button>
    </div>
    <div class="arac__sag">
      <div class="gorunum" role="group" aria-label="Görünüm">
        <button type="button" data-gorunum="tablo">Tablo</button>
        <button type="button" data-gorunum="kart">Kart</button>
      </div>
      <button type="button" id="csv-indir" class="btn btn--birincil" disabled>CSV indir</button>
    </div>
  </nav>

  <section class="filtreler" aria-label="Filtreler">
    <label class="ara">Ara
      <input type="search" id="f-ara" name="ara" placeholder="Başlık ya da kanal adı" autocomplete="off" spellcheck="false">
    </label>
    <label>Zaman
      <select id="f-zaman">
        <option value="1">Son 24 saat</option>
        <option value="3" selected>Son 3 gün</option>
        <option value="7">Son 7 gün</option>
      </select>
    </label>
    <label>Tür
      <select id="f-tur">
        <option value="">Hepsi</option>
        <option value="short">Short</option>
        <option value="uzun">Uzun</option>
      </select>
    </label>
    <label>Ülke / dil
      <select id="f-ulke"><option value="">Hepsi</option></select>
    </label>
    <label>Kategori
      <select id="f-kategori"><option value="">Hepsi</option></select>
    </label>
    <label>Sırala
      <select id="f-sira"><option value="onerilen">Önerilen sıra</option></select>
    </label>
  </section>

  <main>
    <p id="sayac" class="sayac" aria-live="polite"></p>
    <div id="icerik">
      <div class="iskelet" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </main>
</div>

<dialog id="ayarlar" class="ayarlar" aria-labelledby="ayarlar-baslik">
  <form method="dialog" class="ayarlar__ic">
    <h2 id="ayarlar-baslik">Ayarlar</h2>
    <p class="ayarlar__not">Kanal engelleme için GitHub anahtarı gerekir. Anahtar yalnızca bu tarayıcıda saklanır, depoya yazılmaz. Anahtar yoksa engelle düğmeleri görünmez.</p>
    <label class="alan">GitHub anahtarı
      <input type="password" id="anahtar" name="anahtar" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    </label>
    <div class="ayarlar__dugmeler">
      <button type="button" id="anahtar-kaydet" class="btn btn--birincil">Kaydet ve dene</button>
      <button type="button" id="anahtar-sil" class="btn">Anahtarı sil</button>
    </div>
    <p id="anahtar-durum" class="ayarlar__durum" role="status"></p>
    <h3>Engellenen kanallar</h3>
    <ul id="engel-listesi" class="engel-listesi"></ul>
    <div class="ayarlar__alt">
      <button type="submit" class="btn">Kapat</button>
    </div>
  </form>
</dialog>

<div id="bildirim" class="bildirim" role="status" aria-live="polite" hidden>
  <span id="bildirim-metin"></span>
  <button type="button" id="bildirim-geri" class="btn" hidden>Geri al</button>
</div>

<script src="app.js"></script>
</body>
</html>
